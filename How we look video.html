<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How we look — motion video</title>
<link rel="stylesheet" href="colors_and_type.css?v=130">
<link rel="stylesheet" href="styles.css?v=154">
<link rel="stylesheet" href="ad-v2.css?v=225">
<style id="hl-css">
html,body{margin:0;background:#F0F3F5}
svg[data-om-exportable-video-with-duration-secs]{max-width:none!important}
a{color:var(--ink,#002533)}a:hover{color:var(--blue-darker,#004A66)}
.hl{position:absolute;left:0;top:0;width:1920px;height:1168px;transform:scale(2);transform-origin:0 0;background:#F0F3F5;overflow:hidden;color:var(--ink,#002533)}.hl-in{position:absolute;left:160px;top:80px;width:1600px;height:1008px;display:flex;flex-direction:column;justify-content:safe center}.hl-in>*{flex-shrink:0}.hl-in.measuring{justify-content:flex-start;height:auto}
.hl .hl-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin:0 0 32px}.hl .sub-title{margin:0!important;padding:0;border:0}
.hl .sub-title h3{margin:0}
.hl .sub-title .st-rule{margin:12px 0 0}
.hl .rt-tabs{position:relative;margin:0;isolation:isolate;flex:none}
.hl .rt-tabs button,.hl .rt-tabs button[aria-selected="true"]{background:transparent;transition:none;cursor:default}
.hl .rt-pill{position:absolute;top:0;height:100%;border-radius:999px;background:var(--ink,#002533);z-index:-1}
.hl .rt-stack{position:relative;display:grid}
.hl .rt-stack>.rule-grid{grid-area:1/1;margin:0;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 24px;align-content:start}
.hl .rule-card .pr-img{aspect-ratio:auto;height:var(--img-h,0px)}
.hl .pr-img{cursor:default}
.hl .rule-card{will-change:opacity,transform}
</style>
<script>window.OM_SCENES = '[{"name":"Professionals","dur":4,"desc":"Professionals tab"},{"name":"Product","dur":4,"desc":"Product tab"},{"name":"Presentations","dur":4,"desc":"Presentations tab, then pages back to Professionals"}]';</script>
<script>window.OM_PLAYBACK = '{"mode":"loop"}';</script>
<script>window.TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{"motionEditor":true}/*EDITMODE-END*/;</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="rt-panels.js?v=2"></script>
<script type="text/babel" src="animations-v3.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const HL_LOOP=12,HL_SEG=4,HL_X=0.9;
const HL_TABS=["Professionals","Product","Presentations"];
const hlEase=x=>x<0?0:x>1?1:(x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2);
function hlMix(a,b,t){return a.map((v,i)=>Math.round(v+(b[i]-v)*t))}
function HowWeLook(){
  const {T}=useComposition();
  const ref=React.useRef(null);
  const [css,setCss]=React.useState('');
  const [rects,setRects]=React.useState(null);
  const [fit,setFit]=React.useState(null);
  React.useEffect(()=>{Promise.all(['colors_and_type.css?v=130','styles.css?v=151','ad-v2.css?v=225'].map(u=>fetch(u).then(r=>r.text()))).then(a=>setCss(a.join('\n')+document.getElementById('hl-css').textContent))},[]);
  React.useLayoutEffect(()=>{if(!css||!ref.current)return;const inn=ref.current.querySelector('.hl-in');let dead=false;const measure=()=>{if(dead)return;inn.classList.add('measuring');inn.style.setProperty('--img-h','0px');const base=inn.scrollHeight;inn.classList.remove('measuring');const cw=(1520-48)/3;const h=Math.round(cw*2/3);inn.style.setProperty('--img-h',h+'px');inn.classList.add('measuring');const H=inn.scrollHeight;inn.classList.remove('measuring');const k=Math.min(1,1064/H);setFit({h,k,top:52+(1064-H*k)/2,H})};(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(()=>requestAnimationFrame(measure)));const bs=[...ref.current.querySelectorAll('.rt-tabs button')];const p=bs[0].parentNode.getBoundingClientRect(),k=p.width/bs[0].parentNode.offsetWidth;setRects(bs.map(b=>{const r=b.getBoundingClientRect();return [(r.left-p.left)/k,r.width/k]}))},[css]);
  const t=((T%HL_LOOP)+HL_LOOP)%HL_LOOP;
  const seg=Math.floor(t/HL_SEG),local=t-seg*HL_SEG,xs=HL_SEG-HL_X;
  const prog=local<xs?0:hlEase((local-xs)/HL_X);
  const cur=seg,nxt=(seg+1)%3;
  const pos=cur+(nxt===0?-2:1)*prog;
  let pill=null;if(rects){const i0=Math.floor(Math.min(pos,1.9999)),f=pos-i0,a=rects[i0],b=rects[Math.min(i0+1,2)];pill={left:a[0]+(b[0]-a[0])*f,width:a[1]+(b[1]-a[1])*f}}
  const ON=[255,255,255],OFF=[75,99,110];
  React.useLayoutEffect(()=>{
    const el=ref.current;if(!el)return;
    el.querySelectorAll('.rt-stack>.rule-grid').forEach((g,gi)=>{
      const cards=[...g.children];
      cards.forEach((c,ci)=>{
        const st=ci*0.06;
        let o=0,y=0;
        if(gi===cur){const q=hlEase(Math.min(1,Math.max(0,(prog-st)/0.5)));o=1-q;y=-14*q}
        else if(gi===nxt){const q=hlEase(Math.min(1,Math.max(0,(prog-0.4-st)/0.5)));o=q;y=18*(1-q)}
        c.style.opacity=o.toFixed(3);c.style.transform='translateY('+y.toFixed(2)+'px)';
      });
      g.style.visibility=(gi===cur||gi===nxt)?'visible':'hidden';
    });
    const root=el.closest('[data-om-exportable-video-with-duration-secs]');if(root)root.setAttribute('data-screen-label','How we look '+Math.floor(T)+'s');
  });
  return (<div className="hl" ref={ref}>
    <style>{css}</style>
    <div className="hl-in" style={fit?{"--img-h":fit.h+"px",transform:"scale("+fit.k+")",transformOrigin:"50% 0",top:fit.top+"px",height:fit.H+"px"}:{visibility:"hidden"}}>
    <div className="hl-head"><div className="sub-title pr-rules-head"><h3>How we look</h3><p className="st-rule">These hold for every image and every shot type. Break one and the image doesn't ship.</p></div>
    <div className="rt-tabs" role="tablist" aria-label="Image subject">
      {pill&&<span className="rt-pill" style={{left:pill.left+'px',width:pill.width+'px'}}></span>}
      {HL_TABS.map((n,i)=>{const d=Math.max(0,1-Math.abs(pos-i));const c=hlMix(OFF,ON,d);return <button key={n} type="button" role="tab" aria-selected={i===Math.round(pos)%3?'true':'false'} style={{color:'rgb('+c.join(',')+')',borderColor:'rgba(0,37,51,'+(0.15*(1-d)).toFixed(3)+')'}}>{n}</button>})}
    </div></div>
    <div className="rt-stack">{window.RT_PANELS.map((p,i)=><div key={i} className="rule-grid" dangerouslySetInnerHTML={{__html:p}}></div>)}</div>
    </div>
  </div>);
}
function App(){
  const [t,setTweak]=useTweaks(window.TWEAK_DEFAULTS);
  return (<>
    <CompositionStage width={3840} height={2336} scenes={window.OM_SCENES} playback={window.OM_PLAYBACK} bg="#F0F3F5"><HowWeLook/></CompositionStage>
    <TweaksPanel><TweakSection label="Video"/><TweakToggle label="Motion editor" value={t.motionEditor} onChange={v=>setTweak('motionEditor',v)}/></TweaksPanel>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
