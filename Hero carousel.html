<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero carousel — all frames</title>
<link rel="stylesheet" href="colors_and_type.css?v=110"><link rel="stylesheet" href="styles.css?v=110">
<script src="image-slot.js?v=110"></script>
<style>body{margin:0;background:var(--white);color:var(--ink,#002533)}a{color:var(--blue-darker)}a:hover{color:var(--ink,#002533)}
.sheet{max-width:1320px;margin:0 auto;padding:var(--gut-2xl,64px) var(--gutter,32px);display:grid;gap:var(--gut-2xl,64px)}
.row h2{margin:0 0 var(--gut-l,24px);font-size:var(--t-sub);letter-spacing:var(--ls-tight,-0.03em);padding-top:18px;border-top:1px solid color-mix(in oklch,currentColor 16%,transparent)}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gut,24px)}
figure{margin:0;display:grid;gap:12px}
.frame{position:relative;aspect-ratio:3/4;border-radius:var(--radius-l,12px);overflow:hidden;background:var(--cream)}
.frame image-slot{position:absolute;inset:0}
.frame.on-gradient{background:var(--blue-deepest) url("assets/brand-gradient.avif") center/cover no-repeat}
figcaption{display:flex;gap:10px;font-size:var(--text-body-s,0.875rem);line-height:1.45;color:var(--neutral-dark)}
figcaption span{font-family:var(--mono);font-size:11px;letter-spacing:0.1em;color:var(--blue-darker);padding-top:2px}
@media (max-width:900px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body><main class="sheet"><section class="row"><h2>Professionals</h2><div class="strip"><figure><div class="frame"><image-slot id="hero-pro-1" shape="rect" fit="cover" src="assets/photo-brand-facing-light.png" placeholder="Drop a photo — Lifestyle: a professional walking through light"></image-slot></div><figcaption><span>01</span>Lifestyle: a professional walking through light</figcaption></figure><figure><div class="frame"><image-slot id="hero-pro-2" shape="rect" fit="cover" src="assets/photo-range-editorial.png" placeholder="Drop a photo — Portrait: editorial, directional light"></image-slot></div><figcaption><span>02</span>Portrait: editorial, directional light</figcaption></figure><figure><div class="frame"><image-slot id="hero-pro-3" shape="rect" fit="cover" src="assets/photo-icp-desk.png" placeholder="Drop a photo — Lifestyle: building a deck at a desk"></image-slot></div><figcaption><span>03</span>Lifestyle: building a deck at a desk</figcaption></figure><figure><div class="frame"><image-slot id="hero-pro-4" shape="rect" fit="cover" src="assets/photo-icp-exec.png" placeholder="Drop a photo — Portrait: presenting in a conference room"></image-slot></div><figcaption><span>04</span>Portrait: presenting in a conference room</figcaption></figure></div></section><section class="row"><h2>Product</h2><div class="strip"><figure><div class="frame"><image-slot id="hero-prod-1" shape="rect" fit="cover" src="assets/hero-laptop.png" placeholder="Drop a photo — Product in situ: the editor on a laptop"></image-slot></div><figcaption><span>01</span>Product in situ: the editor on a laptop</figcaption></figure><figure><div class="frame"><image-slot id="hero-prod-2" shape="rect" fit="cover" placeholder="Drop a photo — Product in situ: presenting from the app"></image-slot></div><figcaption><span>02</span>Product in situ: presenting from the app</figcaption></figure><figure><div class="frame"><image-slot id="hero-prod-3" shape="rect" fit="cover" placeholder="Drop a photo — Product in situ: Create with AI on screen"></image-slot></div><figcaption><span>03</span>Product in situ: Create with AI on screen</figcaption></figure><figure><div class="frame"><image-slot id="hero-prod-4" shape="rect" fit="cover" placeholder="Drop a photo — Product in situ: a Smart Slide on a tablet"></image-slot></div><figcaption><span>04</span>Product in situ: a Smart Slide on a tablet</figcaption></figure></div></section><section class="row"><h2>Content</h2><div class="strip"><figure><div class="frame"><image-slot id="hero-content-1" shape="rect" fit="cover" src="assets/hero-content-stack.png" placeholder="Drop a photo — Slides on abstract: a fanned deck"></image-slot></div><figcaption><span>01</span>Slides on abstract: a fanned deck</figcaption></figure><figure><div class="frame on-gradient"><image-slot id="hero-content-2" shape="rect" fit="cover" src="assets/hero-content-fan.png" placeholder="Drop a photo — Slides on the brand gradient: a fanned deck"></image-slot></div><figcaption><span>02</span>Slides on the brand gradient: a fanned deck</figcaption></figure><figure><div class="frame"><image-slot id="hero-content-3" shape="rect" fit="cover" placeholder="Drop a photo — Slides on abstract: a chart slide on Gallery Grey"></image-slot></div><figcaption><span>03</span>Slides on abstract: a chart slide on Gallery Grey</figcaption></figure><figure><div class="frame"><image-slot id="hero-content-4" shape="rect" fit="cover" placeholder="Drop a photo — Slides in product: a deck in presenter view"></image-slot></div><figcaption><span>04</span>Slides in product: a deck in presenter view</figcaption></figure></div></section><p style="margin:0"><a href="05-art-direction.html#photography">Back to Art direction</a></p></main></body></html>
