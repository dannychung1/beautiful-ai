<style>
body.pb-solo{margin:0;background:var(--scheme5-bg,#F0F3F5);min-height:100vh}
a{color:var(--blue-darker,#004A66)}a:hover{color:var(--ink,#002533)}

<script>
(function(){
  var V='?v=167',G='?v=149';
  function load(src){return new Promise(function(r){var s=document.createElement('script');s.src=src;s.onload=r;s.onerror=r;document.body.appendChild(s)})}
  fetch('05-art-direction.html',{cache:'no-store'}).then(function(r){return r.text()}).then(function(t){
    var doc=new DOMParser().parseFromString(t,'text/html');
    var head=doc.getElementById('make'),bd=doc.querySelector('[data-builder]');
    if(head)document.querySelector('.pb-head').appendChild(document.importNode(head,true)).removeAttribute('id');
    var main=document.querySelector('.pb-main');
    if(bd){main.appendChild(document.importNode(bd,true));var n=bd.nextElementSibling;if(n&&n.classList.contains('callout'))main.appendChild(document.importNode(n,true));}
    var ds=[].map.call(doc.querySelectorAll('script[src]'),function(s){return s.getAttribute('src')});
    var pick=function(name,fb){return ds.filter(function(s){return s.indexOf(name)===0})[0]||fb};
    return load(pick('ad-data.js','ad-data.js'+V)).then(function(){return load(pick('ad-gallery.js','ad-gallery.js'+G))}).then(function(){return load(pick('copy-block.js','copy-block.js?v=130'))});
  });
})();
</script>
