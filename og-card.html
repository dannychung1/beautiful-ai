<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OG card — 1200×630</title>
<link rel="stylesheet" href="colors_and_type.css?v=130">
<link rel="stylesheet" href="styles.css?v=130">
<style>html,body{margin:0;background:#222;display:grid;place-items:center;min-height:100vh}
#og{width:1200px;height:630px;overflow:hidden;position:relative}
#og .cover{width:1200px;height:630px;min-height:0;padding:64px 72px;row-gap:24px}
#og .cover-top{padding-right:0;margin-top:0;font-size:12px}
#og .cover-logo{width:220px;margin-top:0}
#og .cover-head{font-size:150px;line-height:0.92}
#og .cover-bottom{font-size:12px}
#og .cover-bottom .right{text-align:right}
#og .scroll-cue{display:none}</style>
</head>
<body>
<div id="og">
<section class="cover">
  <div class="cover-mark" aria-hidden="true"></div>
  <div class="cover-mark alt" aria-hidden="true"></div>
  <div class="cover-dither" aria-hidden="true"></div>
  <div class="cover-top">
    <div class="col brandmark"><img src="assets/beautifulai-logo-white.svg" alt="Beautiful.ai" class="cover-logo"></div>
    <div class="col" style="text-align:right"></div>
  </div>
  <div class="cover-title">
    <h1 class="h-display cover-head"><span class="l1">Brand</span><span class="l2">Guidelines</span></h1>
  </div>
  <div class="cover-bottom">
    <div>
      <div>Setting the new standard</div>
      <div>For AI presentations</div>
    </div>
    <div class="right"><div>V2.0 — LAST UPDATED 05.15.2026</div></div>
  </div>
</section>
</div>
</body>
</html>
