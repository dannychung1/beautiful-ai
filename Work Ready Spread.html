<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work ready. — tagline spread</title>
<link rel="stylesheet" href="_ds/bai-design-system-11d6d6c9-2b5f-478d-bd98-680365f23cc4/colors_and_type.css">
<style>
@font-face{font-family:'Post Grotesk';src:url('fonts/PostGrotesk-Book.woff') format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Post Grotesk';src:url('fonts/PostGrotesk-Medium.woff') format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Post Grotesk';src:url('fonts/PostGrotesk-Bold.woff') format('woff');font-weight:700;font-display:swap}
html,body{margin:0;background:var(--color-neutral-lightest,#F0F3F5)}
a{color:var(--color-blue-dark,#0094CC)}a:hover{color:var(--color-neutral-darkest,#001A24)}
.spread{display:grid;place-items:center;min-height:100vh;padding:clamp(12px,2vw,40px);font-family:'Post Grotesk',system-ui,sans-serif}
.stage{position:relative;width:100%;max-width:1760px;aspect-ratio:16/9;container-type:inline-size;perspective:1400px;perspective-origin:50% 50%}
/* ── slide-proportioned blocks: every tile is 16:9, like a slide ── */
.tofu{position:absolute;aspect-ratio:16/9;border-radius:8px;overflow:hidden;transform-style:preserve-3d;will-change:transform;box-shadow:0 14px 34px rgba(0,26,36,0.14),0 2px 6px rgba(0,26,36,0.08)}
.tofu img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform-origin:50% 50%;will-change:transform}
/* z-plane 1 — back */
.t1{left:0;top:7%;width:30%;z-index:1}
.t3{left:63%;top:3%;width:34%;z-index:1}
.t5{left:3%;top:55%;width:26%;z-index:1}
.t7{left:62%;top:56%;width:32%;z-index:1}
/* z-plane 3 — front */
.t2{left:31%;top:3%;width:18%;z-index:3}
.t4{left:46%;top:28%;width:20%;z-index:3}
.t6{left:23%;top:71%;width:28%;z-index:3}
/* z-plane 4 — product UI vignettes: smaller, quieter, secondary to the portraits */
.uitile{position:absolute;aspect-ratio:16/9;z-index:4;border-radius:6px;background:var(--color-white,#fff);
  border:1px solid rgba(0,9,13,0.10);box-shadow:0 6px 16px rgba(0,26,36,0.08);transform-style:preserve-3d;will-change:transform;
  display:grid;grid-template-rows:minmax(0,1fr) auto;gap:max(4px,0.5cqw);padding:max(6px,0.85cqw);min-height:0;overflow:hidden}
.uitile .ulabel{min-width:0;white-space:nowrap;font-family:var(--font-mono,'Martian Mono',monospace);font-size:max(6px,0.5cqw);
  letter-spacing:0.08em;text-transform:uppercase;color:var(--color-neutral-medium,#4C5255)}
.uitile .frame{display:grid;grid-template-columns:minmax(0,1fr) 34%;gap:max(4px,0.6cqw);min-width:0;min-height:0;align-items:center}
.stackcol{display:grid;gap:max(3px,0.4cqw);min-width:0;min-height:0;align-content:center}
.bar{height:max(3px,0.75cqw);border-radius:2px;background:var(--color-neutral-light,#D8DADA)}
.bar.fill{background:var(--color-blue,#52D0FF)}
.bar.ink{background:var(--color-neutral-darkest,#001A24)}
.mini{aspect-ratio:16/9;min-height:0;border-radius:2px;background:var(--color-neutral-lightest,#F0F3F5);border:1px solid rgba(0,9,13,0.08)}
.mini.on{background:var(--color-blue-lightest,#E5F8FF);border-color:rgba(0,148,204,0.35)}
.dots{display:flex;gap:max(3px,0.4cqw);align-items:center}
.dot{width:max(6px,1.4cqw);aspect-ratio:1;border-radius:999px;background:linear-gradient(140deg,var(--color-blue,#52D0FF),var(--color-magenta,#DB2475))}
.dot.n2{background:linear-gradient(140deg,var(--color-green,#87D0B1),var(--color-blue,#52D0FF))}
.dot.n3{background:linear-gradient(140deg,var(--color-yellow,#FFCD66),var(--color-orange,#FF703B))}
.u1{left:52%;top:4%;width:11%}
.u2{left:52%;top:86%;width:11%}
.u3{left:0;top:72%;width:11%}
/* z-plane 5 — type, gradient throughout */
.word{position:absolute;z-index:5;margin:0;font-weight:500;font-size:15cqw;line-height:1;letter-spacing:-0.055em;white-space:nowrap;
  background:linear-gradient(96deg,var(--color-blue-darker,#004A66) 0%,var(--color-blue-dark,#0094CC) 13%,#6E2E9E 52%,var(--color-magenta,#DB2475) 88%);background-size:180% 100%;background-position:50% 50%;
  -webkit-background-clip:text;background-clip:text;color:transparent;padding:0.1em 0.05em 0.16em;will-change:transform}
.w1{left:4%;top:21%}
.w2{left:32%;top:44%;background:linear-gradient(96deg,#2C63A8 0%,#6E2E9E 40%,var(--color-magenta,#DB2475) 84%);background-size:180% 100%;background-position:50% 50%;-webkit-background-clip:text;background-clip:text}
@media (max-width:820px){
  .stage{aspect-ratio:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;perspective:none}
  .tofu,.uitile{position:relative;left:auto!important;top:auto!important;width:auto!important;transform:none!important}
  .t7{grid-column:1/3}
  .word{position:relative;left:auto;top:auto;font-size:19vw;white-space:normal;order:-1;transform:none!important}
  .w1{grid-column:1/3;margin-top:8vh}
  .w2{grid-column:1/3;margin:0 0 6vh 0.3em}
}
@media (prefers-reduced-motion:reduce){.tofu,.tofu img,.word,.uitile{transform:none!important}}
</style>
</head>
<body>
<section class="spread" data-screen-label="Work ready spread">
  <div class="stage" id="stage">
    <div class="tofu t1" data-lag="0.028"><img src="assets/photo-icp-desk.png" alt="Building a deck at a desk" data-zoom="1.97" style="object-position:30% 58%"></div>
    <div class="tofu t3" data-lag="0.019"><img src="assets/photo-icp-exec.png" alt="Presenting in a conference room" data-zoom="1.65" style="object-position:29% 15%"></div>
    <div class="tofu t5" data-lag="0.042"><img src="assets/photo-range-cafe.png" alt="Working through a deck together" data-zoom="1.7" style="object-position:31% 15%"></div>
    <div class="tofu t7" data-lag="0.024"><img src="assets/photo-range-hero.jpg" alt="Preparing before the meeting" data-zoom="1.7" style="object-position:30% 32%"></div>
    <p class="word w1" data-lag="0.012">Work</p>
    <p class="word w2" data-lag="0.009">ready.</p>
    <div class="tofu t2" data-lag="0.055"><img src="assets/photo-icp-booth.png" alt="Pitching at a booth"></div>
    <div class="tofu t4" data-lag="0.034"><img src="assets/photo-light-screenglow.png" alt="Deck on screen"></div>
    <div class="tofu t6" data-lag="0.047"><img src="assets/photo-icp-warmlight.png" alt="Sales pitch across a table"></div>

    <div class="uitile u1" data-lag="0.072">
      <div class="frame">
        <div class="stackcol"><div class="bar ink" style="width:82%"></div><div class="bar" style="width:56%"></div><div class="bar fill" style="width:68%"></div></div>
        <div class="stackcol"><div class="mini on"></div><div class="mini"></div></div>
      </div>
      <span class="ulabel">Smart slides</span>
    </div>

    <div class="uitile u2" data-lag="0.066">
      <div class="frame">
        <div class="stackcol"><div class="bar fill" style="width:94%"></div><div class="bar" style="width:40%"></div></div>
        <div class="stackcol"><div class="mini on"></div><div class="mini on"></div></div>
      </div>
      <span class="ulabel">Prompt to deck</span>
    </div>

    <div class="uitile u3" data-lag="0.079">
      <div class="frame">
        <div class="dots"><span class="dot"></span><span class="dot n2"></span><span class="dot n3"></span></div>
        <div class="stackcol"><div class="mini on"></div></div>
      </div>
      <span class="ulabel">On brand</span>
    </div>
  </div>
</section>
<script>
(function(){
  var stage=document.getElementById('stage');
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var items=[].slice.call(stage.querySelectorAll('.tofu,.word,.uitile')).map(function(el){
    return {el:el,img:el.querySelector('img'),lag:parseFloat(el.dataset.lag)||0.03,rx:0,ry:0,tx:0,ty:0,ix:0,iy:0,gx:50,gy:50,txr:0,tyr:0,ttx:0,tty:0};
  });
  var px=0.5,py=0.5;
  function measure(){
    var r=stage.getBoundingClientRect();
    items.forEach(function(it){
      var b=it.el.getBoundingClientRect();
      it.cx=(b.left+b.width/2-r.left)/r.width;
      it.cy=(b.top+b.height/2-r.top)/r.height;
    });
  }
  function onMove(e){
    var r=stage.getBoundingClientRect();
    px=(e.clientX-r.left)/r.width;py=(e.clientY-r.top)/r.height;
  }
  function tick(){
    items.forEach(function(it){
      var dx=px-(it.cx||0.5),dy=py-(it.cy||0.5);
      var isWord=it.el.classList.contains('word');
      var amp=isWord?3:(it.el.classList.contains('uitile')?14:11);
      // rotate to face the cursor, translate away from it
      it.txr=-dy*amp;it.tyr=dx*amp;
      it.ttx=-dx*(isWord?8:22);it.tty=-dy*(isWord?5:15);
      it.rx+=(it.txr-it.rx)*it.lag;it.ry+=(it.tyr-it.ry)*it.lag;
      it.tx+=(it.ttx-it.tx)*it.lag;it.ty+=(it.tty-it.ty)*it.lag;
      it.el.style.transform='translate3d('+it.tx.toFixed(2)+'px,'+it.ty.toFixed(2)+'px,0) rotateX('+it.rx.toFixed(2)+'deg) rotateY('+it.ry.toFixed(2)+'deg)';
      if(it.el.classList.contains('word')){
        // the gradient inside the letterforms slides against the cursor too
        var gpx=50-dx*26,gpy=50-dy*16;
        it.gx+=(gpx-it.gx)*(it.lag*0.55);it.gy+=(gpy-it.gy)*(it.lag*0.55);
        it.el.style.backgroundPosition=it.gx.toFixed(2)+'% '+it.gy.toFixed(2)+'%';
      }
      if(it.img){
        // the photo inside lags further still and drifts the other way
        var gx=dx*20,gy=dy*14;
        it.ix+=(gx-it.ix)*(it.lag*0.55);it.iy+=(gy-it.iy)*(it.lag*0.55);
        it.img.style.transform='translate3d('+it.ix.toFixed(2)+'px,'+it.iy.toFixed(2)+'px,0) scale('+(parseFloat(it.img.dataset.zoom)||1.12)+')';
      }
    });
    requestAnimationFrame(tick);
  }
  measure();
  window.addEventListener('resize',measure);
  window.addEventListener('pointermove',onMove,{passive:true});
  document.addEventListener('pointerleave',function(){px=0.5;py=0.5;});
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
